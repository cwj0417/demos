<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#101a3c"/>
            <stop offset="0.55" stop-color="#081228"/>
            <stop offset="1" stop-color="#040a14"/>
        </linearGradient>
        <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="rgba(126,92,255,0.4)"/>
            <stop offset="0.55" stop-color="rgba(75,196,255,0.12)"/>
            <stop offset="1" stop-color="rgba(75,196,255,0)"/>
        </radialGradient>
        <g id="solid">
            <rect x="-11" y="-1.5" width="22" height="3" rx="1.5" fill="rgba(191,233,255,0.82)"/>
        </g>
        <g id="broken">
            <rect x="-11" y="-1.5" width="9" height="3" rx="1.5" fill="rgba(191,233,255,0.82)"/>
            <rect x="2" y="-1.5" width="9" height="3" rx="1.5" fill="rgba(191,233,255,0.82)"/>
        </g>
        <g id="trigram">
            <use href="#solid" y="-6"/>
            <use href="#broken" y="0"/>
            <use href="#solid" y="6"/>
        </g>
    </defs>
    <rect width="400" height="240" fill="url(#bg)"/>
    <rect width="400" height="240" fill="url(#halo)" opacity="0.9"/>
    <g fill="rgba(143,232,255,0.55)">
        <circle cx="58" cy="44" r="1.4"/>
        <circle cx="120" cy="28" r="1"/>
        <circle cx="338" cy="52" r="1.6"/>
        <circle cx="356" cy="196" r="1.2"/>
        <circle cx="44" cy="188" r="1.3"/>
        <circle cx="210" cy="214" r="1"/>
        <circle cx="300" cy="34" r="1"/>
    </g>
    <g transform="translate(200 120)">
        <circle r="84" fill="none" stroke="rgba(75,196,255,0.16)" stroke-dasharray="2 7"/>
        <circle r="58" fill="none" stroke="rgba(143,232,255,0.28)"/>
        <circle r="42" fill="none" stroke="rgba(126,92,255,0.24)"/>
        <g opacity="0.85">
            <g transform="translate(0 -76)"><use href="#trigram"/></g>
            <g transform="rotate(45) translate(0 -76)"><use href="#trigram"/></g>
            <g transform="rotate(90) translate(0 -76)"><use href="#trigram"/></g>
            <g transform="rotate(135) translate(0 -76)"><use href="#trigram"/></g>
            <g transform="rotate(180) translate(0 -76)"><use href="#trigram"/></g>
            <g transform="rotate(225) translate(0 -76)"><use href="#trigram"/></g>
            <g transform="rotate(270) translate(0 -76)"><use href="#trigram"/></g>
            <g transform="rotate(315) translate(0 -76)"><use href="#trigram"/></g>
        </g>
        <g stroke="rgba(75,196,255,0.5)" stroke-width="1.2">
            <line x1="0" y1="-20" x2="0" y2="20"/>
            <line x1="-20" y1="0" x2="20" y2="0"/>
            <line x1="-14" y1="-14" x2="14" y2="14" stroke="rgba(126,92,255,0.4)"/>
            <line x1="14" y1="-14" x2="-14" y2="14" stroke="rgba(126,92,255,0.4)"/>
        </g>
        <circle r="4" fill="rgba(233,250,255,0.9)"/>
        <circle r="10" fill="none" stroke="rgba(143,232,255,0.45)"/>
    </g>
</svg>
